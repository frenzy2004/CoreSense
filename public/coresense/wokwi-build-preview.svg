<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">CoreSense ESP32-C3 Wokwi build preview</title>
  <desc id="description">Circuit topology for the CoreSense Wokwi harness with an ESP32-C3, MPU6050, button, haptic LED proxy, NTC, and logic analyzer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111b2d"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b42"/>
      <stop offset="1" stop-color="#0b2730"/>
    </linearGradient>
    <style>
      .label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#dce8f7}.small{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#91a5bd}.pin{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#07111f}.metric{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#f4f8ff}.mono{font:600 13px Consolas,monospace;fill:#a9bad0}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.card{fill:#101d2e;stroke:#31435b;stroke-width:2}.chip{fill:#202b3a;stroke:#5d728c;stroke-width:2}.dot{stroke:#07111f;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="48" y="58" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#f4f8ff">CoreSense Wokwi build</text>
  <text x="48" y="85" class="small">ESP32-C3 safety-band simulation harness · SIMULATION ONLY</text>
  <rect x="868" y="34" width="284" height="62" rx="12" fill="#3a2118" stroke="#ff8058"/>
  <circle cx="895" cy="65" r="8" fill="#ff8058"/>
  <text x="916" y="60" class="label" fill="#ffd3c4">Live run blocked</text>
  <text x="916" y="80" class="small" fill="#ffb69d">VS Code license expired</text>

  <g>
    <rect x="420" y="150" width="330" height="430" rx="28" fill="url(#board)" stroke="#30c7b4" stroke-width="3"/>
    <rect x="496" y="222" width="178" height="190" rx="18" class="chip"/>
    <text x="585" y="278" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="800" fill="#f1f8ff">ESP32-C3</text>
    <text x="585" y="307" text-anchor="middle" class="small">DevKitM-1</text>
    <rect x="535" y="332" width="100" height="48" rx="8" fill="#07111f" stroke="#6d849e"/>
    <text x="585" y="361" text-anchor="middle" class="mono">RISC-V</text>
    <rect x="520" y="164" width="130" height="34" rx="8" fill="#d7e0e7"/>
    <rect x="558" y="171" width="54" height="20" rx="3" fill="#1e2a37"/>
    <text x="585" y="548" text-anchor="middle" class="small">USB Serial · UART telemetry</text>
  </g>

  <g>
    <rect x="54" y="154" width="278" height="128" rx="18" class="card"/>
    <rect x="76" y="180" width="78" height="76" rx="12" fill="#173a59" stroke="#38b0ff" stroke-width="2"/>
    <circle cx="115" cy="218" r="23" fill="#38b0ff"/>
    <path d="M105 218h20M115 208v20" stroke="#07111f" stroke-width="4" stroke-linecap="round"/>
    <text x="176" y="198" class="label">Band button</text>
    <text x="176" y="222" class="small">wake · page · ACK</text>
    <text x="176" y="246" class="small">5 s hold → SOS</text>
  </g>

  <g>
    <rect x="54" y="326" width="278" height="128" rx="18" class="card"/>
    <rect x="76" y="350" width="82" height="82" rx="14" fill="#193444" stroke="#68d8ce" stroke-width="2"/>
    <circle cx="100" cy="375" r="7" fill="#cbd7e4"/><circle cx="134" cy="375" r="7" fill="#cbd7e4"/>
    <circle cx="100" cy="407" r="7" fill="#cbd7e4"/><circle cx="134" cy="407" r="7" fill="#cbd7e4"/>
    <text x="180" y="372" class="label">MPU6050</text>
    <text x="180" y="397" class="small">I²C motion features</text>
    <text x="180" y="420" class="small">synthetic fall traces</text>
  </g>

  <g>
    <rect x="54" y="498" width="278" height="128" rx="18" class="card"/>
    <circle cx="116" cy="552" r="28" fill="#451c20" stroke="#ff5964" stroke-width="3"/>
    <circle cx="116" cy="552" r="14" fill="#ff5964"/>
    <text x="176" y="542" class="label">Haptic proxy</text>
    <text x="176" y="567" class="small">LED + logic analyzer</text>
    <text x="176" y="590" class="small">250 ms motor-safe pulse</text>
  </g>

  <g>
    <rect x="850" y="154" width="296" height="128" rx="18" class="card"/>
    <circle cx="912" cy="218" r="34" fill="#24364d" stroke="#ffd75a" stroke-width="3"/>
    <path d="M912 191v37a18 18 0 1 0 12 17" fill="none" stroke="#ffd75a" stroke-width="7" stroke-linecap="round"/>
    <text x="968" y="198" class="label">Skin NTC</text>
    <text x="968" y="222" class="small">ADC path on GPIO0</text>
    <text x="968" y="246" class="small">default model: 34 °C</text>
  </g>

  <g>
    <rect x="850" y="326" width="296" height="128" rx="18" class="card"/>
    <path d="M881 416v-52h86v52M895 400l16-20 18 11 20-29" fill="none" stroke="#b178ff" stroke-width="5"/>
    <text x="990" y="372" class="label">Logic analyzer</text>
    <text x="990" y="397" class="small">D0 haptic · D1 button</text>
    <text x="990" y="420" class="small">timing evidence</text>
  </g>

  <g>
    <rect x="850" y="498" width="296" height="128" rx="18" class="card"/>
    <text x="878" y="532" class="label">Deterministic telemetry</text>
    <text x="878" y="558" class="mono">HR → ECTemp EKF</text>
    <text x="878" y="582" class="mono">CT + variance + CI</text>
    <text x="878" y="606" class="mono">derived features only</text>
  </g>

  <path d="M332 218H380V452H420" class="wire" stroke="#28c8ee"/>
  <path d="M332 382H390V308H420" class="wire" stroke="#68d8ce"/>
  <path d="M332 552H420" class="wire" stroke="#ff8058"/>
  <path d="M750 218H850" class="wire" stroke="#ffd75a"/>
  <path d="M750 382H850" class="wire" stroke="#b178ff"/>
  <path d="M750 552H850" class="wire" stroke="#67e8a5"/>
  <circle cx="420" cy="452" r="8" fill="#28c8ee" class="dot"/><circle cx="420" cy="308" r="8" fill="#68d8ce" class="dot"/>
  <circle cx="420" cy="552" r="8" fill="#ff8058" class="dot"/><circle cx="750" cy="218" r="8" fill="#ffd75a" class="dot"/>
  <circle cx="750" cy="382" r="8" fill="#b178ff" class="dot"/><circle cx="750" cy="552" r="8" fill="#67e8a5" class="dot"/>

  <rect x="48" y="660" width="1104" height="38" rx="10" fill="#09131f" stroke="#26384f"/>
  <text x="68" y="684" class="mono">BUILD PASS · firmware.bin 298,336 B · RAM 14,500 B / 327,680 B · flash image 285,376 B / 1,310,720 B · 5/5 scenario definitions PASS</text>
</svg>
